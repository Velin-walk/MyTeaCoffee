<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Nepal Forest Study | 10 Native Plants & Botanical Focus</title>
  <meta name="description" content="Focus on your study sessions and cultivate Nepal's 50 native plants - Nepal Forest Focus Pomodoro App.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2D5016">
  <script>
    // Iframe-friendly non-blocking notification replacing window.alert
    window.alert = function(msg) {
      console.log('[Notice]', msg);
      const toast = document.createElement('div');
      toast.textContent = msg;
      toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:8px;z-index:99999;font-size:13px;font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,0.25);transition:opacity 0.3s;pointer-events:none;';
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
      }, 2500);
    };
  </script>

  <!-- 10 Native Botanical Plants of Nepal Modules & SVG Engine -->
  <script src="/plants/rhododendron.js"></script>
  <script src="/plants/peepal.js"></script>
  <script src="/plants/banyan.js"></script>
  <script src="/plants/sal.js"></script>
  <script src="/plants/pine.js"></script>
  <script src="/plants/mugwort.js"></script>
  <script src="/plants/bamboo.js"></script>
  <script src="/plants/nettle.js"></script>
  <script src="/plants/lotus.js"></script>
  <script src="/plants/marigold.js"></script>
  <script src="/plants/sunakhari.js"></script>
  <script src="/plants/sunpati.js"></script>
  <script src="/plants/suntala.js"></script>
  <script src="/plants/jacaranda.js"></script>
  <script src="/plants/registry.js"></script>
  <link rel="stylesheet" href="/css/forest.css">
  <link rel="stylesheet" href="/css/quotes.css">
</head>
<body class="theme-forest">

  <!-- Compact Top App Bar -->
  <header class="top-header">
    <a href="/" class="header-back-link" title="Back to Study Charts">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <span>Charts</span>
    </a>

    <h1 class="header-title">Nepal Forest</h1>

    <div class="header-controls">
      <select id="forestThemeSelect" class="theme-select-minimal" onchange="changeForestTheme(this.value)" aria-label="Theme">
        <option value="theme-forest" selected>Forest</option>
        <option value="default">Light</option>
        <option value="theme-paper">Old Paper</option>
        <option value="theme-blackboard">Blackboard</option>
        <option value="theme-sketch">Pencil Sketch</option>
        <option value="theme-galaxy">Galaxy</option>
        <option value="theme-cyberpunk">Cyberpunk</option>
        <option value="theme-ocean">Ocean</option>
      </select>

      <button class="header-btn" onclick="toggleFullscreen()" id="btnFullscreenHeader" title="Fullscreen Focus Mode" aria-label="Fullscreen Focus Mode">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <span class="header-btn-label">Fullscreen</span>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="forest-main-container">
    <div id="globalQuoteHost" class="global-quote-host"></div>

    <!-- Minimal Focus Studio -->
    <section class="forest-focus-studio">
      <button type="button" class="plant-picker-bar" onclick="openPlantsModal()" title="Change plant species">
        <div class="plant-avatar" id="activePlantAvatar"></div>
        <div class="plant-picker-text">
          <div class="plant-picker-names">
            <span class="plant-nepali-name" id="activePlantNepali">लालीगुराँस</span>
            <span class="meta-sep" aria-hidden="true">·</span>
            <span class="plant-english-name" id="activePlantEnglish">Rhododendron</span>
          </div>
          <div class="plant-picker-sub">
            <span class="plant-scientific" id="activePlantScientific">Rhododendron arboreum</span>
            <span class="meta-sep" aria-hidden="true">·</span>
            <span id="activePlantCategory">National Flower / Tree</span>
          </div>
        </div>
        <span class="plant-picker-action">
          <span>Change</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </button>

      <div class="timer-focus-card">
        <div class="growth-ring-container">
          <svg class="growth-ring-svg" viewBox="0 0 250 250">
            <circle class="growth-ring-bg" cx="125" cy="125" r="105"></circle>
            <circle id="forestGrowthRing" class="growth-ring-progress" cx="125" cy="125" r="105"></circle>
          </svg>
          <div id="forestGrowthStageGraphic" class="growth-svg-center"></div>
        </div>

        <div id="forestTimerDigits" class="timer-digits">25:00</div>
        <div id="forestStatusLabel" class="stage-status-label">Ready to Plant</div>

        <div class="timer-mode-switcher" role="group" aria-label="Timer mode">
          <button id="btnModeFixed" class="mode-seg-btn active" onclick="setTimerMode('fixed')">Fixed</button>
          <button id="btnModeOpen" class="mode-seg-btn" onclick="setTimerMode('open')">Open</button>
        </div>

        <div class="duration-pills-wrap" id="forestDurationRow" role="group" aria-label="Session duration">
          <button class="duration-pill" onclick="setTimerDuration(15, this)">15m</button>
          <button class="duration-pill active" onclick="setTimerDuration(25, this)">25m</button>
          <button class="duration-pill" onclick="setTimerDuration(45, this)">45m</button>
          <button class="duration-pill" onclick="setTimerDuration(60, this)">60m</button>
          <button class="duration-pill" onclick="setTimerDuration(90, this)">90m</button>
          <button class="duration-pill" onclick="setTimerDuration(120, this)">120m</button>
        </div>

        <div class="timer-action-buttons">
          <button id="btnStartForestSession" class="btn-timer-start" onclick="startOrResumeSession()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12M12 12C9 12 6 9.5 6 6c3.5 0 6 2.5 6 6zM12 14c3 0 6-2 6-5-3 0-6 2-6 5z"/></svg>
            <span>Plant &amp; Focus</span>
          </button>
          <button id="btnCompleteOpenSession" class="btn-timer-start" onclick="completeOpenSession()" style="display: none;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 4 13c0-4.5 4-8 10-10 1 6-2.5 13-3 17z"/><path d="M11 20c1.5-3 4-6 9-7-2 3-5 5.5-9 7z"/></svg>
            <span>Finish &amp; Plant</span>
          </button>
          <button id="btnGiveUpForestSession" class="btn-timer-giveup" onclick="giveUpSession()" style="display: none;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            <span>Give Up</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Minimal Summary & Planted Forest -->
    <section class="my-forest-card">
      <div class="forest-stats-grid">
        <div class="stat-box">
          <div id="statTotalPlanted" class="stat-number">0</div>
          <div class="stat-label">Planted</div>
        </div>
        <div class="stat-box">
          <div id="statTotalFocusTime" class="stat-number">0m</div>
          <div class="stat-label">Focus</div>
        </div>
        <div class="stat-box">
          <div id="statThrivingCount" class="stat-number stat-healthy">0</div>
          <div class="stat-label">Healthy</div>
        </div>
        <div class="stat-box">
          <div id="statWitheredCount" class="stat-number stat-withered">0</div>
          <div class="stat-label">Withered</div>
        </div>
      </div>

      <div class="forest-toolbar">
        <span class="forest-toolbar-title">My Planted Forest</span>
        <div class="forest-filter-group" role="group" aria-label="Forest filter">
          <button class="filter-seg-btn active" id="btnFilterToday" onclick="filterForest('today')">Today</button>
          <button class="filter-seg-btn" id="btnFilterWeek" onclick="filterForest('week')">Week</button>
          <button class="filter-seg-btn" id="btnFilterAll" onclick="filterForest('all')">All</button>
        </div>
      </div>

      <div id="forestPlotsContainer" class="forest-grid-plots forest-grid-canvas"></div>
    </section>
  </main>

  <!-- Plant Picker Sheet -->
  <div id="catalogModal" class="catalog-modal-backdrop" style="display: none;" onclick="closeModalOnBackdrop(event)">
    <div class="catalog-modal-box" onclick="event.stopPropagation()">
      <div class="modal-sheet-handle" aria-hidden="true"></div>
      <div class="modal-head">
        <h3>Select Plant</h3>
        <button class="btn-close-modal" onclick="closePlantsModal()" aria-label="Close">&times;</button>
      </div>

      <div class="modal-filters">
        <input type="text" id="catalogSearchInput" class="search-box-input" placeholder="Search species..." oninput="filterPlantsCatalog()">
        <div class="modal-cat-tabs" role="group" aria-label="Filter by category">
          <button class="duration-pill active" onclick="setCategoryFilter('all', this)">All</button>
          <button class="duration-pill" onclick="setCategoryFilter('Tree', this)">Trees</button>
          <button class="duration-pill" onclick="setCategoryFilter('Flower', this)">Flowers</button>
          <button class="duration-pill" onclick="setCategoryFilter('Herb', this)">Herbs</button>
          <button class="duration-pill" onclick="setCategoryFilter('Grass', this)">Bamboo</button>
        </div>
      </div>

      <div id="catalogPlantsList" class="modal-plants-grid"></div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/log-queue.js"></script>
  <script src="/js/forest-diorama.js"></script>
  <script src="/js/forest.js"></script>
  <script src="/js/quotes.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
